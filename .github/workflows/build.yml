name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROIDAPI: 33
      ANDROIDMINAPI: 24
      ANDROIDNDK: 25b
      ANDROIDSDK: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      P4A_RELEASE_KEYSTORE_PASSWD: ""
      P4A_RELEASE_KEY_PASSWD: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            zip \
            unzip \
            tar \
            build-essential \
            git \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses6 \
            libncurses-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            wget

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython==0.29.36

      - name: Install Buildozer and python-for-android
        run: |
          pip install buildozer==1.5.0
          pip install python-for-android==2024.01.21

      - name: Clean previous builds
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer

      - name: Initialize Buildozer
        run: |
          buildozer init || true

      - name: Build APK
        run: |
          buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROIDAPI: 33
          ANDROIDMINAPI: 24

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vannia-ai-apk
          path: bin/*.apk
