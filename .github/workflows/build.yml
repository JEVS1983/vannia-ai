name: Build Vannia AI Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: ⚙️ Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          zip unzip openjdk-17-jdk \
          python3-pip git \
          libffi-dev libssl-dev \
          build-essential \
          libsqlite3-dev zlib1g-dev \
          wget

    - name: 📦 Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    # 🔥 FIX 1: licencias
    - name: 🔓 Accept licenses
      run: |
        mkdir -p ~/.android
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses

        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

        touch ~/.android/repositories.cfg

    # 🔥 FIX 2: crear sdkmanager donde Buildozer lo busca
    - name: 🛠 Fix sdkmanager path
      run: |
        SDK=~/.buildozer/android/platform/android-sdk

        mkdir -p $SDK/cmdline-tools
        cd $SDK

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip -d cmdline-tools
        mv cmdline-tools/cmdline-tools cmdline-tools/latest

        mkdir -p $SDK/tools/bin
        ln -s $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager

    # 🔧 primer run (descarga todo)
    - name: ⚙️ Initial setup
      run: |
        buildozer android debug || true

    # 🚀 build final
    - name: 📱 Build APK
      run: |
        buildozer android release
