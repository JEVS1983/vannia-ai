name: Build Vannia AI Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: ⚙️ Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            zip unzip \
            openjdk-17-jdk \
            python3-pip \
            libffi-dev \
            libssl-dev

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # 🔥 FIX CRÍTICO: instalar correctamente Android SDK + sdkmanager
      - name: 📲 Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk

          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true

          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

      # 🔥 FIX: aceptar licencias correctamente
      - name: ✅ Accept licenses
        run: |
          yes | sdkmanager --licenses

      # 🔥 instalar componentes necesarios
      - name: 📥 Install SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"

      # 🔥 evitar bug de buildozer con tools/bin
      - name: 🔧 Fix sdkmanager path (Buildozer bug)
        run: |
          mkdir -p $HOME/android-sdk/tools/bin
          ln -s $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager

      - name: 🚀 Build APK / AAB
        run: |
          buildozer android release

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vannia-ai-build
          path: bin/*.aab
