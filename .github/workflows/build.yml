name: Build Vannia AI Android FINAL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y zip unzip openjdk-17-jdk python3-pip wget

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    # 🔥 SDK GLOBAL (NO local)
    - name: Install Android SDK
      run: |
        mkdir -p /home/runner/android-sdk/cmdline-tools
        cd /home/runner/android-sdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk.zip
        unzip sdk.zip -d cmdline-tools
        mv cmdline-tools/cmdline-tools cmdline-tools/latest

    - name: Add SDK to PATH
      run: |
        echo "/home/runner/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "/home/runner/android-sdk/platform-tools" >> $GITHUB_PATH

    # 🔥 LICENCIAS (AQUÍ ESTABA TU BLOQUEO)
    - name: Accept licenses
      run: yes | sdkmanager --licenses

    # 🔥 VERSIONES COMPATIBLES (NO 37)
    - name: Install SDK packages
      run: |
        sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    # 🔥 FORZAR A BUILDOZER A USAR ESTE SDK
    - name: Force SDK path for Buildozer
      run: |
        mkdir -p ~/.buildozer/android/platform
        ln -s /home/runner/android-sdk ~/.buildozer/android/platform/android-sdk

    - name: Clean build
      run: buildozer android clean

    - name: Build APK
      run: buildozer -v android release
