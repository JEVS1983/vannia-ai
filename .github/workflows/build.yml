name: Build Vannia AI Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip wget openjdk-17-jdk python3-pip

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    # 🔥 LIMPIEZA TOTAL (IMPORTANTE)
    - name: Clean old build cache
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer

    # 🔥 INSTALAR ANDROID CMD TOOLS
    - name: Install Android SDK tools
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ || true

    - name: Accept licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Android packages (stable)
      run: |
        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    # 🔥 IMPORTANTE: NO usar buildozer clean (rompe p4a)
    - name: Build APK/AAB
      run: |
        buildozer android update
        buildozer -v android release
