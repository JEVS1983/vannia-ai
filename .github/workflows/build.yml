name: Build Vannia AI Android

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y zip unzip openjdk-17-jdk python3-pip build-essential git
        pip install --upgrade pip
        pip install buildozer cython

    # 🔥 ANDROID SDK CORRECTO
    - name: Install Android SDK
      run: |
        mkdir -p android-sdk/cmdline-tools

        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip -d android-sdk/cmdline-tools

        mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest

    - name: Set Android environment
      run: |
        echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

    # 🔥 ACEPTAR LICENCIAS AUTOMÁTICAMENTE
    - name: Accept licenses and install SDK packages
      run: |
        yes | sdkmanager --licenses

        sdkmanager "platform-tools" \
                   "platforms;android-33" \
                   "build-tools;33.0.2"

    # 🔥 BUILD
    - name: Build APK / AAB
      run: |
        buildozer android release
