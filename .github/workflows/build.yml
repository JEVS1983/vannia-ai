name: Build Vannia AI Android (FAST)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 🔥 CACHE PRINCIPAL (CLAVE)
      - name: ⚡ Cache buildozer + SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.android
            ~/android-sdk
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: ⚙️ Dependencias mínimas (más rápido)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk zip unzip git

      - name: 📦 Python deps
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # 🔥 SOLO instala SDK si NO existe (clave velocidad)
      - name: 📲 Setup Android SDK (cached)
        run: |
          if [ ! -d "$HOME/android-sdk" ]; then
            echo "Instalando SDK..."
            mkdir -p $HOME/android-sdk/cmdline-tools
            cd $HOME/android-sdk

            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
            unzip commandlinetools-linux-9477386_latest.zip

            mkdir -p cmdline-tools/latest
            mv cmdline-tools/* cmdline-tools/latest/ || true
          else
            echo "SDK cacheado 👍"
          fi

          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

      - name: ✅ Licencias (rápido si cacheado)
        run: |
          yes | sdkmanager --licenses || true

      - name: 📥 SDK components
        run: |
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-33" || true
          sdkmanager "build-tools;33.0.2" || true

      # 🔥 FIX buildozer bug
      - name: 🔧 Fix sdkmanager path
        run: |
          mkdir -p $HOME/android-sdk/tools/bin
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager

      - name: 🚀 Build
        run: |
          buildozer android release

      - name: 📤 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vannia-ai
          path: bin/*.aab
