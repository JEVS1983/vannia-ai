name: Build Vannia AI Android (FAST FIXED)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # 🔥 Python correcto (NO 3.1)
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # ⚡ CACHE (CLAVE PARA VELOCIDAD)
    - name: Cache buildozer & sdk
      uses: actions/cache@v3
      with:
        path: |
          .buildozer
          android-sdk
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    # 🔥 Instalar dependencias MINIMAS (sin basura)
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git zip unzip \
          openjdk-17-jdk \
          libffi-dev libssl-dev \
          python3-pip

        pip install --upgrade pip
        pip install buildozer cython

    # 🔥 Instalar SDK CORRECTAMENTE (sin freeze)
    - name: Install Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools

        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O sdk.zip
        unzip -q sdk.zip -d $ANDROID_HOME/cmdline-tools

        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 🔥 Licencias SIN BLOQUEO
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true

    # 🔥 Instalar paquetes necesarios
    - name: Install SDK packages
      run: |
        sdkmanager "platform-tools" \
                   "platforms;android-33" \
                   "build-tools;33.0.2"

    # 🚀 BUILD
    - name: Build APK / AAB
      run: |
        buildozer android release

    # 📦 Guardar resultado
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: bin/*.aab
