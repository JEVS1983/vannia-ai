name: Build Vannia AI Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip wget openjdk-17-jdk python3-pip

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    # 🔥 INSTALAR SDK COMPLETO (INCLUYE SDKMANAGER)
    - name: Install Android Command Line Tools
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip -d cmdline-tools
        mv cmdline-tools/cmdline-tools cmdline-tools/latest

    - name: Set SDK environment
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

    # 🔥 ACEPTAR LICENCIAS SIN INTERACCIÓN
    - name: Accept Android licenses
      run: |
        yes | sdkmanager --licenses || true

    # 🔥 INSTALAR SDK ESTABLE (NO 37)
    - name: Install Android SDK packages
      run: |
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    - name: Build APK/AAB
      run: |
        buildozer android clean
        buildozer -v android release
