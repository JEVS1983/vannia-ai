[app]

# (str) Title of your application
title = Vannia AI

# (str) Package name
package.name = vanniaai

# (str) Package domain
package.domain = org.vannia

# (str) Source code where the main.py live
source.dir = .

# (list) Source files to include
source.include_exts = py,png,jpg,kv

# (str) Application versioning
version = 1.0

# (list) Application requirements
requirements = python3,kivy

# (str) Supported orientation
orientation = portrait

# (bool) Fullscreen mode
fullscreen = 0

# 🔥 ANDROID CONFIG CORRECTO
android.api = 33
android.minapi = 21
android.ndk = 25b

# ⚠️ Aunque salga warning, lo dejamos fijo
android.sdk = 33

# 🔥 Acepta licencias automáticamente (ayuda pero NO suficiente solo)
android.accept_sdk_license = True

# 🔥 NUEVO FORMATO (evita warning deprecado)
android.archs = arm64-v8a

# 🔥 IMPORTANTE estabilidad
p4a.branch = stable

# 🔥 Evita errores comunes
log_level = 2
warn_on_root = 0
