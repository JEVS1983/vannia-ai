name: Build Vannia AI Android

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 📥 Clonar repo
    - name: Checkout
      uses: actions/checkout@v4

    # 🐍 Python estable
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # ☕ Java optimizado (sin apt)
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    # ⚡ Cache (acelera muchísimo)
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}

    # 📦 Dependencias
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y zip unzip git build-essential libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    # 📱 Instalar Android SDK (nuevo formato)
    - name: Install Android SDK
      run: |
        mkdir -p android-sdk/cmdline-tools

        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip -d android-sdk/cmdline-tools

        mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest

    # 📜 Instalar paquetes SDK (FIX sdkmanager)
    - name: Install SDK packages
      run: |
        SDK="$GITHUB_WORKSPACE/android-sdk/cmdline-tools/latest/bin/sdkmanager"

        chmod +x $SDK

        yes | $SDK --licenses

        $SDK --sdk_root=$GITHUB_WORKSPACE/android-sdk \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    # 🌍 Variables de entorno
    - name: Set Android environment
      run: |
        echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

    # 🛠️ Build
    - name: Build APK / AAB
      run: |
        buildozer android release

    # 📦 Guardar resultado
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: bin/*.aab
