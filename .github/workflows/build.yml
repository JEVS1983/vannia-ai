name: Build Vannia AI Android (REAL FAST)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 🔥 CACHE REAL (EL IMPORTANTE)
      - name: ⚡ Cache buildozer (SDK + NDK + compilación)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ./.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: ⚙️ Dependencias mínimas
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk zip unzip git

      - name: 📦 Python deps
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # 🔥 CLAVE: evitar reinstalación del SDK
      - name: 🚫 Disable SDK auto-download
        run: |
          export BUILDOZER_ALLOW_SDK_DOWNLOAD=0
          export BUILDOZER_ALLOW_NDK_DOWNLOAD=0
          echo "BUILDOZER_ALLOW_SDK_DOWNLOAD=0" >> $GITHUB_ENV
          echo "BUILDOZER_ALLOW_NDK_DOWNLOAD=0" >> $GITHUB_ENV

      - name: 🚀 Build
        run: |
          buildozer android release

      - name: 📤 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vannia-ai
          path: bin/*.aab
