name: Build Vannia AI Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          zip unzip openjdk-17-jdk \
          python3-pip git \
          libffi-dev libssl-dev \
          build-essential

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    # ⚠️ IMPORTANTE: NO SDK MANUAL
    # ⚠️ NO sdkmanager
    # ⚠️ NO ANDROID_SDK_ROOT

    - name: Build APK
      run: |
        buildozer android release
