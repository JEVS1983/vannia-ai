name: Build Vannia AI Android STABLE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip wget openjdk-17-jdk python3-pip

    - name: Install Buildozer + p4a
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36
        pip install python-for-android

    # 🔥 LIMPIEZA SEGURA (NO BUILD ANDROID CLEAN)
    - name: Clean only build cache
      run: |
        rm -rf .buildozer

    # 🔥 INSTALL ANDROID SDK (MANUAL CONTROLADO)
    - name: Install Android SDK
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip

        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ || true

        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --licenses || true

        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    # 🔥 BUILD SIN CLEAN (CRÍTICO)
    - name: Build APK
      run: |
        buildozer android update
        buildozer -v android release
